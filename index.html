<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hádej Kdo - MLP Edice</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Žlutočervený přechod pozadí */
            background: linear-gradient(135deg, #ff7a3d, #ffdd44);
            color: #000000;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .app-container {
            max-width: 500px;
            width: 100%;
            /* Jemně obarvená vnitřní karta, aby ladila s pozadím */
            background-color: #fff8eb;
            border: 2px solid #ffcc66;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #222;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }
        .display-box {
            width: 100%;
            height: 280px;
            border: 2px solid #ffd280;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 10px;
            background-color: #ffffff;
        }
        .display-box img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }
        .display-box p {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            color: #333;
        }
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        /* Modrá tlačítka pro volby */
        .btn-option {
            background-color: #3b82f6;
            border: none;
            color: #ffffff;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-option:hover {
            background-color: #2563eb;
        }
        .btn-option:active {
            transform: scale(0.98);
        }
        /* Tlačítko pro novou hru */
        .btn-reset {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-reset:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Vítej ve hře Hádej Kdo - MLP Edice</h1>
        <div id="questionText" class="question-text">1. Je tvá postava z G4 nebo G5?</div>

        <div class="display-box" id="displayBox"></div>

        <div class="buttons-container" id="buttonsContainer"></div>

        <button class="btn-reset" onclick="resetGame()" id="resetBtn" style="display:none;">Nová hra</button>
    </div>

            { jmeno: "Zipp Storm", fotka: "obrázky/Zipp_Storm.png", gen: "G5", pohlavi: "Zena", druh: "Pegas", barvaSrsti: "Bila", barvaHrivy: "Vicebarevna" },
            { jmeno: "Hitch Trailblazer", fotka: "obrázky/Hitch_Trailblazer.png", gen: "G5", pohlavi: "Muz", druh: "Pozemsky", barvaSrsti: "Zluta", barvaHrivy: "Tmave zelena" },
            { jmeno: "Misty Brightdawn", fotka: "obrázky/Misty_Brightdawn.png", gen: "G5", pohlavi: "Zena", druh: "Jednorozec", barvaSrsti: "Modra", barvaHrivy: "Vicebarevna" },
            { jmeno: "Starlight Glimmer", fotka: "obrázky/Starlight_glimmer.png", gen: "G4", pohlavi: "Zena", druh: "Jednorozec", barvaSrsti: "Ruzova", barvaHrivy: "Fialova se svetle modrym pruhem" },
            { jmeno: "princess Luna", fotka: "obrázky/Princess_Luna.png", gen: "G4", pohlavi: "Zena", druh: "Alicorn", barvaSrsti: "Tmave Modra", barvaHrivy: "Tmave modra" },
            { jmeno: "princess Celestia", fotka: "obrázky/Princess_Celestia.png", gen: "G4", pohlavi: "Zena", druh: "Alicorn", barvaSrsti: "Bila", barvaHrivy: "Vicebarevna" },
            { jmeno: "Tempest Shadow", fotka: "obrázky/Tempest_Shadow.png", gen: "G4", pohlavi: "Zena", druh: "Jednorozec", barvaSrsti: "Tmave Fialova", barvaHrivy: "Tmave ruzova" },

            { jmeno: "Sunset Shimmer", fotka: "obrázky/Sunset_Shimmer.png", gen: "G4", pohlavi: "Zena", druh: "Jednorozec", barvaSrsti: "Zlutooranzova", barvaHrivy: "Zluta a cervena" },
	{ jmeno: "Big Macintosh", fotka: "obrázky/Big_Macintosh.png", gen: "G4", pohlavi: "Muz", druh: "Pozemsky", barvaSrsti: "Cervena", barvaHrivy: "Oranzova" },
	{ jmeno: "Apple Bloom", fotka: "obrázky/Apple_Bloom.png", gen: "G4", pohlavi: "Zena", druh: "Pozemsky", barvaSrsti: "Zluta", barvaHrivy: "Cervena" },
	{ jmeno: "Sweetie Belle", fotka: "obrázky/Sweetie_Belle.png", gen: "G4", pohlavi: "Zena", druh: "Jednorozec", barvaSrsti: "Bila", barvaHrivy: "Fialova a svetle ruzova" },
	{ jmeno: "Scootaloo", fotka: "obrázky/Scootaloo.png", gen: "G4", pohlavi: "Zena", druh: "Pegas", barvaSrsti: "Oranzova", barvaHrivi: "Fialova"},
	{ jmeno: "Princess Cadence", fotka: "obrázky/Princess_Cadence.png", gen: "G4", pohlavi: "Zena", druh: "Alicorn", barvaSrsti: "Svetle ruzova", barvaHrivy: "Ruzova, fialova a zluta" },
	{ jmeno: "Queen Chrysalis", fotka: "obrázky/Queen_Chrysalis.png", gen: "G4", pohlavi: "Zena", druh: "Changeling", barvaSrsti: "Cerna", barvaHrivy: "Tmave zelena" },
	{jmeno: "King Sombra", fotka: "obrázky/King_Sombra.png", gen: "G4", pohlavi: "Muz", druh: "Jednorozec", barvaSrsti: "Tmave seda", barvaHrivy: "Cerna" },
	{jmeno: "Sprout Cloverleaf", fotka: "obrázky/Sprout_Cloverleaf.png", gen: "G5", pohlavi: "Muz", druh: "Pozemsky", barvaSrsti: "Cervena", barvyHrivy: "Svetle zluta" },
	{jmeno: "Spitfire", fotka: "obrázky/Spitfire.png", gen: "G4", pohlavi: "Zena", druh: "Pegas", barvaSrsti: "Zlatave zluta", barvaHrivy: "Ohnive oranzova" },
	{jmeno: "Lightning Dust", fotka: "obrázky/Lightning_Dust.png", gen: "G4", pohlavi: "Zena", druh: "Pegas", barvaSrsti: "Tyrkysove modra", barvaHrivy: "Zluta a oranzova"},
	{jmeno: "Granny Smith", fotka: "obrázky/Granny_Smith.png", gen: "G4", pohlavi: "Zena", druh: "Pozemsky", barvaSrsti: "Svetle zelena", barvaHrivy: "Bila"},
	{jmeno: "Cheerilee", fotka: "obrázky/Cheerilee.png", gen: "G4", pohlavi: "Zena", druh: "Pozemsky", barvaSrsti: "Fialova", barvaHrivy: "Ruzova a svetle ruzova"},
	{jmeno: "Derpy Hooves", fotka: "obrázky/Derpy_Hooves.png", gen: "G4", pohlavi: "Zena", druh: "Pegas", barvaSrsti: "Svetle seda", barvaHrivy: "Svetle zluta"},
	{jmeno: "Octavia Melody", fotka: "obrázky/Octavia_Melody.png", gen: "G4", pohlavi: "Zena", druh: "Pozemsky", barvaSrsti: "Seda", barvaHrivy: "Tmave seda"},
	{jmeno: "Vinyl Scratch", fotka: "obrázky/Vinyl_Scratch.png",gen: "G4", pohlavi: "Zena", druh: "Jednorozec", barvaSrsti: "Bila", barvaHrivy: "Modra a svetle modra"},
	{jmeno: "Trixie Lulamoon", fotka: "obrázky/Trixie_Lulamoon.png", gen: "G4", pohlavi: "Zena", druh: "Jednorozec", barvaSrsti: "Svetle modra", barvaHrivy: "Svetle modra a bila"}
        ];

        const kroky = [
            {
                otazka: "1. Je tvá postava z G4 nebo G5?",
                klic: "gen",
                moznosti: [
                    { text: "G4", hodnota: "G4" },
                    { text: "G5", hodnota: "G5" }
                ]
            },
            {
                otazka: "2. Jaké pohlaví je tvoje postava?",
                klic: "pohlavi",
                moznosti: [
                    { text: "Muž", hodnota: "Muz" },
                    { text: "Žena", hodnota: "Zena" }
                ]
            },
            {
                otazka: "3. Jaký druh je tvoje postava?",
                klic: "druh",
                moznosti: [
                    { text: "Pozemský poník", hodnota: "Pozemsky" },
                    { text: "Jednorožec", hodnota: "Jednorozec" },
                    { text: "Pegas", hodnota: "Pegas" },
                    { text: "Alicorn", hodnota: "Alicorn" },
                    { text: "Drak", hodnota: "Drak" },
		{text: "Changeling", hodnota: "Changeling" }
                ]
            },
            {
                otazka: "4. Jakou barvu srsti (či kůže) má tvá postava?",
                klic: "barvaSrsti",
                moznosti: [
                    { text: "Fialová", hodnota: "Fialova" },
                    { text: "Růžová", hodnota: "Ruzova" },
                    { text: "Modrá", hodnota: "Modra" },
                    { text: "Žlutá", hodnota: "Zluta" },
                    { text: "Oranžová", hodnota: "Oranzova" },
                    { text: "Bílá", hodnota: "Bila" },
                    { text: "Tmavě Modrá", hodnota: "Tmave Modra" },
                    { text: "Tmavě Fialová", hodnota: "Tmave Fialova" },
                    { text: "Světle Fialová", hodnota: "Svetle Fialova" },
		    { text: "Žlutooranžová", hodnota: "Zlutooranzova" },
			{ text: "Červená", hodnota: "Cervena" },
			{ text: "Světle růžová", hodnota: "Svetle ruzova" },
			{ text: "Černá", hodnota: "Cerna" },
			{ text: "Tmavě šedá", hodnota: "Tmave seda"},
			{ text: "Zlatavě žlutá", hodnota: "Zlatave zluta"},
			{ text: "Tyrkysově modrá", hodnota: "Tyrkysove modra"},
			{ text: "Světle zelená", hodnota: "Svetle zelena"},
			{text: "Světle šedá", hodnota: "Svetle seda"},
			{ text: "Šedá", hodnota: "Seda"},
			{ text: "Světle modrá", hodnota: "Svetle modra"}
                ]
            },
            {
                otazka: "5. Jakou barvu hřívy (či vlasů) má tvá postava?",
                klic: "barvaHrivy",
                moznosti: [
                    { text: "Tmavě modrá s pruhy", hodnota: "Tmave modra z pruhy" },
                    { text: "Světle žlutá", hodnota: "Svetle zluta" },
                    { text: "Duhová", hodnota: "Duhova" },
                    { text: "Tmavě růžová", hodnota: "Tmave ruzova" },
                    { text: "Světle růžová", hodnota: "Svetle ruzova" },
                    { text: "Tmavě fialová", hodnota: "Tmave fialova" },
                    { text: "Světle zelená", hodnota: "Svetle zelena" },
                    { text: "Tmavě fialová a tmavě růžová", hodnota: "Tmave fialova a tmave ruzova" },
                    { text: "Tmavě Modrofialová", hodnota: "Tmave Modrofialova" },
                    { text: "Fialová", hodnota: "Fialova" },
                    { text: "Vícebarevná", hodnota: "Vicebarevna" },
                    { text: "Tmavě zelená", hodnota: "Tmave zelena" },
                    { text: "Fialová se světle modrým pruhem", hodnota: "Fialova se svetle modrym pruhem" },
                    { text: "Tmavě modrá", hodnota: "Tmave modra" },
                    { text: "Stříbřitě bílá se světle modrým pruhem", hodnota: "Stribrite bila se svetle modrym pruhem" },
                    { text: "Žlutá a červená", hodnota: "Zluta a cervena" },
		{text: "Oranžová", hodnota: "Oranzova" },
		{text: "Červená", hodnota: "Cervena" },
		{text: "Fialová a světle růžová", hodnota: "Fialova a svetle ruzova" },
		{text: "Růžová, fialová a žlutá", hodnota: "Ruzova, fialova a zluta" },
		{text: "Tmavě zelená", hodnota: "Tmave zelena"},
		{text: "Černá", hodnota: "Cerna" },
		{text: "Ohnově oranžová", hodnota: "Ohnove oranzova" },
		{text: "Bílá", hodnota: "Bila"},
		{text: "Růžová a světle růžová", hodnota: "Ruzova a svetle ruzova"},
		{text: "Tmavě šedá", hodnota: "Tmave seda"},
		{text: "Modrá a světle modrá", hodnota: "Modra a svetle modra"},
		{ text: "Světle modrá a bílá", hodnota: "Svetle modra a bila"}
                ]
            }
        ];

        let aktualniKrok = 0;
        let filtrPonici = [];

        function resetGame() {
            aktualniKrok = 0;
            filtrPonici = [...ponici];
            document.getElementById("displayBox").innerHTML = "";
            document.getElementById("resetBtn").style.display = "none";
            nactiKrok();
        }

        function nactiKrok() {
            if (aktualniKrok >= kroky.length || filtrPonici.length <= 1) {
                zobrazVysledek();
                return;
            }

            const krok = kroky[aktualniKrok];
            document.getElementById("questionText").innerText = krok.otazka;

            const btnBox = document.getElementById("buttonsContainer");
            btnBox.innerHTML = "";

            krok.moznosti.forEach(m => {
                const maKandidata = filtrPonici.some(p => p[krok.klic] === m.hodnota);
                if (maKandidata) {
                    const btn = document.createElement("button");
                    btn.className = "btn-option";
                    btn.innerText = m.text;
                    btn.onclick = () => vybratOdpoved(krok.klic, m.hodnota);
                    btnBox.appendChild(btn);
                }
            });
        }

        function vybratOdpoved(klic, hodnota) {
            filtrPonici = filtrPonici.filter(p => p[klic] === hodnota);
            aktualniKrok++;
            nactiKrok();
        }

        function zobrazVysledek() {
            document.getElementById("buttonsContainer").innerHTML = "";
            document.getElementById("resetBtn").style.display = "inline-block";

            const display = document.getElementById("displayBox");

            if (filtrPonici.length === 1) {
                const p = filtrPonici[0];
                document.getElementById("questionText").innerText = "Tvůj poník je:";
                display.innerHTML = `
                    <img src="${p.fotka}" alt="${p.jmeno}">
                    <p>${p.jmeno}</p>
                `;
            } else if (filtrPonici.length > 1) {
                document.getElementById("questionText").innerText = "Odpovídá více postavám!";
                display.innerHTML = `<p>Nalezeno ${filtrPonici.length} možností.</p>`;
            } else {
                document.getElementById("questionText").innerText = "Nikoho jsem nenalezl :-(";
                display.innerHTML = `<p>Žádná postava neodpovídá této kombinaci.</p>`;
            }
        }

        window.onload = resetGame;
    </script>
</body>
</html>
